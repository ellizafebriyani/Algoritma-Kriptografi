<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kriptografi Klasik</title>
    <link rel="stylesheet" href="../static/css/pager-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="../static/js/script.js"></script>
</head>

<body>

    <!-- Dark Mode Toggle -->
    <div class="theme-toggle-container">
        <div class="theme-toggle">
            <input type="checkbox" id="darkmode-toggle">
            <label for="darkmode-toggle">
                <i class="fas fa-sun"></i>
                <i class="fas fa-moon"></i>
            </label>
        </div>
    </div>

    <!-- Title -->
    <div class="title-wrapper container-col">
        <div class="title-bar">
            Full Vigenère Cipher
        </div>
        <div class="subtitle-bar">
            Jenis Vigenère Cipher dengan tabel acak tetap untuk pergeseran alfabet
        </div>
    </div>

    <!-- Form -->
    <form action="{{ url_for('view_fullvigenere_result') }}" method="post" enctype="multipart/form-data" id="upload">
        <div class="input-wrapper container-col">

            <div class="card-container">
                <div class="tab-container">
                    <input type="radio" id="enc" name="act" value="enc" checked>
                    <label for="enc" class="tab">Enkripsi</label>
                    <input type="radio" id="dec" name="act" value="dec">
                    <label for="dec" class="tab">Deskripsi</label>
                </div>
            </div>

            <div class="card-container">
                <h4 class="card-title">Jenis Output</h4>
                <div class="radio-wrapper">
                    <input type="radio" id="txt" name="type-out" value="txt" checked>
                    <label for="txt">Text</label>
                    <input type="radio" id="fil" name="type-out" value="file">
                    <label for="fil">File</label>
                </div>
            </div>

            <div class="card-container">
                <h4 class="card-title">Format Output</h4>
                <div class="radio-wrapper">
                    <input type="radio" id="original" name="format" value="ori" checked>
                    <label for="original">Tanpa Spasi</label>
                    <input type="radio" id="block" name="format" value="block">
                    <label for="block">Kelompok 5 Huruf</label>
                </div>
            </div>

            <div class="card-container">
                <h4 class="card-title">Kata Kunci (key)</h4>
                <div class="input-key-wrapper">
                    <input type="text" name="key" value="{{ key }}" placeholder="Masukkan kata kunci">
                </div>
            </div>

            <div class="card-container">
                <h4 class="card-title">Input Teks Di sini:</h4>
                <div class="text-input-wrapper">
                    <textarea name="message" rows="10" cols="30">{{ inputtext }}</textarea>
                </div>
                <div class="button-container">
                    <button type="submit" class="submit-button" value="Upload">SUBMIT</button>
                </div>
            </div>

            <div class="card-container">
                <h4 class="card-title">Hasil:</h4>
                <div class="result-wrapper">
                    <textarea rows="10" cols="30" readonly>{{ result }}</textarea>
                </div>
            </div>
        </div>
    </form>

    <!-- Navigation Buttons -->
    <div class="container-col">
        <button class="homepage-button">
            <a href="{{ url_for('landing') }}">
                <div class="c-button">
                    HOMEPAGE
                </div>
            </a>
        </button>
    </div>

    <!-- Dark Mode Script -->
    <script>
        const darkModeToggle = document.getElementById('darkmode-toggle');
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-theme');
            darkModeToggle.checked = true;
        }
        darkModeToggle.addEventListener('change', () => {
            if (darkModeToggle.checked) {
                document.body.classList.add('dark-theme');
                localStorage.setItem('darkMode', 'enabled');
            } else {
                document.body.classList.remove('dark-theme');
                localStorage.setItem('darkMode', 'disabled');
            }
        });
    </script>

</body>
</html>
